<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>Login - Aduan Skanilan</title>
  <meta name="description" content="Login to Aduan Skanilan system">
  <meta name="keywords" content="login, pengaduan, skanilan">

  <!-- Favicons -->
  <link href="assets/img/favicon.png" rel="icon">
  <link href="assets/img/apple-touch-icon.png" rel="apple-touch-icon">

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com" rel="preconnect">
  <link href="https://fonts.gstatic.com" rel="preconnect" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Vendor CSS Files -->
  <link href="assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">

  <style>
    body {
      background-color: #172134; /* Dark blue background */
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
    }

    .login-card {
      background-color: #212c40; /* Card background */
      border-radius: 12px;
      padding: 40px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    .login-title {
      color: #ffffff;
      font-weight: 700;
      text-align: center;
      margin-bottom: 5px;
      font-size: 24px;
    }

    .login-subtitle {
      color: #8b95a5;
      text-align: center;
      font-size: 13px;
      margin-bottom: 30px;
    }

    .form-label {
      color: #e2e8f0;
      font-size: 13px;
      margin-bottom: 6px;
    }

    .form-control, .form-select {
      background-color: #101827; /* Input background */
      border: 1px solid #2d3748;
      color: #e2e8f0;
      border-radius: 6px;
      padding: 10px 15px;
      font-size: 14px;
      margin-bottom: 20px;
    }

    .form-control:focus, .form-select:focus {
      background-color: #101827;
      border-color: #3b82f6;
      color: #ffffff;
      box-shadow: none;
    }
    
    .form-select {
      background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3e%3cpath fill='none' stroke='%238b95a5' stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='m2 5 6 6 6-6'/%3e%3c/svg%3e");
    }

    .btn-login {
      background-color: #2563eb;
      color: #ffffff;
      border: none;
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      font-weight: 500;
      font-size: 15px;
      transition: background-color 0.3s;
      margin-top: 10px;
    }

    .btn-login:hover {
      background-color: #1d4ed8;
    }

    .copyright-text {
      text-align: center;
      color: #64748b;
      font-size: 11px;
      margin-top: 25px;
    }
  </style>
</head>

<body>

  <div class="login-card">
    <div class="text-center mb-3">
      <img src="assets/img/logo.png" alt="Logo SMKN 9 Semarang" style="max-height: 80px;">
    </div>
    <h2 class="login-title">Aduan Skanilan</h2>
    <p class="login-subtitle">Silakan login ke sistem</p>

    <form action="index.html" method="get">
      <div>
        <label for="username" class="form-label">Username</label>
        <input type="text" class="form-control" id="username" name="username" required>
      </div>

      <div>
        <label for="password" class="form-label">Password</label>
        <input type="password" class="form-control" id="password" name="password" required>
      </div>

      <div>
        <label for="role" class="form-label">Akses sebagai</label>
        <select class="form-select" id="role" name="role" required>
          <option value="siswa">Siswa</option>
          <option value="admin">Admin</option>
          <option value="guru">Guru</option>
        </select>
      </div>

      <button type="submit" class="btn-login">Login</button>
    </form>

    <p class="copyright-text">2026 © UKK SMK 9 Semarang</p>
  </div>

</body>

</html>
